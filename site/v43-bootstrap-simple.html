<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://txutcpmarsvsdcvgyhtu.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'"><title>DKIVN V4.3 初始化</title><style>:root{--p:rgba(19,24,32,.84);--line:rgba(255,255,255,.08);--t:#f5f7fb;--m:rgba(235,241,249,.58);--g:#59d4a7;--r:#ff7d89;--a:#eabb6d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(900px 650px at 10% 0%,rgba(72,104,170,.17),transparent 65%),linear-gradient(180deg,#090c11,#050609);color:var(--t);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}body{display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);padding:24px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008)),var(--p);backdrop-filter:blur(28px);box-shadow:0 28px 70px rgba(0,0,0,.35)}h1{font-size:21px;margin:0 0 7px}.sub{font-size:11px;color:var(--m);line-height:1.7}.state,.err{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025);font-size:11px;line-height:1.6}.ok{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}form{display:grid;gap:11px}label{display:grid;gap:6px;color:var(--m);font-size:11px}input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.26);color:var(--t);outline:none}button{padding:11px;border-radius:12px;border:1px solid rgba(89,212,167,.25);background:rgba(89,212,167,.08);color:var(--t);font-weight:750;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.err{display:none;border-color:rgba(255,125,137,.2);background:rgba(255,125,137,.055);color:var(--r)}.err.show{display:block}.tip{margin-top:14px;font-size:10px;color:var(--m);line-height:1.7}.hidden{display:none}</style></head><body><section class="card"><h1>DKIVN V4.3 管理員初始化</h1><div class="sub">此版本改用 CORS-simple POST，不再使用 application/json preflight。成功後初始化授權碼立即失效。</div><div id="state" class="state warn">正在檢查後端…</div><div id="formwrap"><form id="f"><label>新管理員密碼<input id="p1" type="password" minlength="12" autocomplete="new-password" required placeholder="至少 12 字元"></label><label>再次輸入密碼<input id="p2" type="password" minlength="12" autocomplete="new-password" required placeholder="再次確認"></label><button id="go" type="submit" disabled>建立管理員密碼</button></form><div id="err" class="err"></div><div class="tip">密碼只送到 Supabase Edge 後端並以 PBKDF2-SHA256 產生雜湊；資料庫不保存明文。</div></div><div id="done" class="hidden"><div class="state ok">✓ 管理員密碼建立成功</div><button id="open">前往 V4.3 控制台</button></div></section><script>const API='https://txutcpmarsvsdcvgyhtu.supabase.co/functions/v1/dkivn-v43-control-9f3c';const MAIN='https://rawcdn.githack.com/yangyunrong/hummingbot/3467f77249e3692873376f6b5f85b52fdfb02749/site/v43-control.html';const q=new URLSearchParams(location.search);let setupCode=q.get('setup')||'';const $=s=>document.querySelector(s);function showErr(m){$('#err').textContent=m;$('#err').classList.add('show')}async function getStatus(){const r=await fetch(API+'/bootstrap-status',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'HTTP '+r.status);return d}async function simplePost(path,obj){const form=new URLSearchParams();form.set('_json',JSON.stringify(obj));const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:form.toString(),cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.message||d.error||'HTTP '+r.status);e.data=d;throw e}return d}async function init(){try{const d=await getStatus();if(d.adminConfigured){$('#state').textContent='管理員已建立，請直接前往控制台登入。';$('#state').className='state ok';$('#formwrap').classList.add('hidden');$('#done').classList.remove('hidden');return}if(!d.bootstrapAvailable){$('#state').textContent='初始化資格不可用。';$('#state').className='state bad';showErr('請使用最新初始化連結。');return}if(!setupCode){$('#state').textContent='缺少初始化授權碼。';$('#state').className='state bad';showErr('網址沒有 setup 授權碼。');return}$('#state').textContent='後端正常，可以建立管理員密碼。';$('#state').className='state ok';$('#go').disabled=false}catch(e){$('#state').textContent='後端連線失敗。';$('#state').className='state bad';showErr(e.message)}}$('#f').onsubmit=async e=>{e.preventDefault();$('#err').classList.remove('show');const a=$('#p1').value,b=$('#p2').value;if(a.length<12)return showErr('密碼至少 12 字元。');if(a!==b)return showErr('兩次密碼不一致。');$('#go').disabled=true;$('#go').textContent='建立中…';try{await simplePost('/setup',{password:a,setupCode});setupCode='';$('#p1').value='';$('#p2').value='';$('#formwrap').classList.add('hidden');$('#done').classList.remove('hidden');$('#state').textContent='初始化完成。';$('#state').className='state ok'}catch(e){showErr((e.data?.error?e.data.error+'：':'')+e.message);$('#go').disabled=false;$('#go').textContent='建立管理員密碼'}};$('#open').onclick=()=>location.href=MAIN;init();</script></body></html>
