<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://txutcpmarsvsdcvgyhtu.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'"><title>DKIVN V4.3 初始化</title><style>:root{--bg:#07090d;--p:rgba(19,24,32,.82);--line:rgba(255,255,255,.08);--t:#f5f7fb;--m:rgba(235,241,249,.58);--g:#59d4a7;--r:#ff7d89;--a:#eabb6d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(900px 650px at 10% 0%,rgba(72,104,170,.17),transparent 65%),linear-gradient(180deg,#090c11,#050609);color:var(--t);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}body{display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);padding:24px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008)),var(--p);backdrop-filter:blur(28px);box-shadow:0 28px 70px rgba(0,0,0,.35)}h1{font-size:21px;margin:0 0 7px}.sub{font-size:11px;color:var(--m);line-height:1.7}.state{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025);font-size:11px}.ok{color:var(--g)}.warn{color:var(--a)}.bad{color:var(--r)}form{display:grid;gap:11px}label{display:grid;gap:6px;color:var(--m);font-size:11px}input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.26);color:var(--t);outline:none}input:focus{border-color:rgba(143,175,255,.45)}button{padding:11px;border-radius:12px;border:1px solid rgba(89,212,167,.25);background:rgba(89,212,167,.08);color:var(--t);font-weight:750;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.err{display:none;margin-top:12px;padding:11px;border-radius:12px;border:1px solid rgba(255,125,137,.2);background:rgba(255,125,137,.055);color:var(--r);font-size:11px;line-height:1.6}.err.show{display:block}.tip{margin-top:14px;font-size:10px;color:var(--m);line-height:1.7}.success{display:none}.success.show{display:block}.formwrap.hide{display:none}</style></head><body><section class="card"><h1>DKIVN V4.3 管理員初始化</h1><div class="sub">這個頁面只負責第一次建立管理員密碼。成功後會自動關閉初始化資格，並跳回交易控制台。</div><div id="state" class="state warn">正在檢查初始化狀態…</div><div id="formwrap" class="formwrap"><form id="f"><label>新管理員密碼<input id="p1" type="password" autocomplete="new-password" minlength="12" required placeholder="至少 12 字元"></label><label>再次輸入密碼<input id="p2" type="password" autocomplete="new-password" minlength="12" required placeholder="再次確認"></label><button id="go" type="submit" disabled>建立管理員密碼</button></form><div id="err" class="err"></div><div class="tip">建議使用 16 字元以上，包含英文大小寫、數字與符號。密碼只會送到 Supabase Edge 後端做 PBKDF2-SHA256 雜湊；資料庫不保存明文密碼。</div></div><div id="success" class="success"><div class="state ok">✓ 管理員密碼建立成功。初始化授權碼已失效。</div><button id="open">前往 V4.3 控制台登入</button></div></section><script>const API='https://txutcpmarsvsdcvgyhtu.supabase.co/functions/v1/dkivn-v43-control-9f3c';const MAIN='https://rawcdn.githack.com/yangyunrong/hummingbot/3467f77249e3692873376f6b5f85b52fdfb02749/site/v43-control.html';const qs=new URLSearchParams(location.search);let setupCode=qs.get('setup')||'';const $=s=>document.querySelector(s);function error(m){$('#err').textContent=m;$('#err').classList.add('show')}async function call(path,opt={}){const h={Accept:'application/json'};if(opt.body)h['Content-Type']='application/json';const r=await fetch(API+path,{method:opt.method||'GET',headers:h,cache:'no-store',body:opt.body?JSON.stringify(opt.body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.message||d.error||'HTTP '+r.status);e.data=d;throw e}return d}async function init(){try{const d=await call('/bootstrap-status');if(d.adminConfigured){$('#state').textContent='管理員已經建立，請直接前往控制台登入。';$('#state').className='state ok';$('#formwrap').classList.add('hide');$('#success').classList.add('show');$('#open').textContent='前往 V4.3 控制台';return}if(!d.bootstrapAvailable){$('#state').textContent='初始化資格目前不可用。';$('#state').className='state bad';error('請使用最新的初始化連結。');return}if(!setupCode){$('#state').textContent='缺少初始化授權碼。';$('#state').className='state bad';error('你開啟的網址沒有包含 setup 授權碼，請使用最新連結。');return}$('#state').textContent='後端初始化狀態正常，可以建立管理員密碼。';$('#state').className='state ok';$('#go').disabled=false;history.replaceState(null,'',location.pathname)}catch(e){$('#state').textContent='無法連線初始化服務。';$('#state').className='state bad';error(e.message)}}$('#f').onsubmit=async e=>{e.preventDefault();$('#err').classList.remove('show');const a=$('#p1').value,b=$('#p2').value;if(a.length<12)return error('密碼至少需要 12 字元。');if(a!==b)return error('兩次輸入的密碼不一致。');$('#go').disabled=true;$('#go').textContent='建立中…';try{await call('/setup',{method:'POST',body:{password:a,setupCode}});setupCode='';$('#p1').value='';$('#p2').value='';$('#formwrap').classList.add('hide');$('#success').classList.add('show');$('#state').textContent='初始化完成。';$('#state').className='state ok';setTimeout(()=>location.href=MAIN,1800)}catch(e){error((e.data?.error?e.data.error+'：':'')+e.message);$('#go').disabled=false;$('#go').textContent='建立管理員密碼'}};$('#open').onclick=()=>location.href=MAIN;init();</script></body></html>
