function')toast('保存失敗：'+err.message)}});const ws=new WebSocket('wss://stream.toobit.com/quote/ws/v1');ws.onopen=()=>{ws.send(JSON.stringify({symbol:'BTC-SWAP-USDT',topic:'bookTicker',event:'sub'}));setInterval(()=>ws.readyState===1&&ws.send(JSON.stringify({ping:Date.now()})),30000)};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.topic!=='bookTicker'||!m.data)return;const d=Array.isArray(m.data)?m.data[0]:m.data,b=Number(d.b),a=Number(d.a);if(!(b>0&&a>b))return;const mid=(a+b)/2;document.getElementById('rdMid').textContent='$'+mid.toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});document.getElementById('rdTouch').textContent='Bid '+b.toFixed(1)+' · Ask '+a.toFixed(1)+' · Spread '+(((a-b)/mid)*10000).toFixed(2)+' bps'};setInterval(state,2500);setTimeout(state,800)})();
